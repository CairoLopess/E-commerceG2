spring.application.name=pedidos
server.port=${PORT:3003}

# Lê o .env da raiz do repositório (ou da pasta do serviço) ao rodar fora do Docker.
# No Docker, as variáveis vêm do docker-compose.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Banco (Postgres próprio: o pedidos não enxerga o banco de ninguém)
spring.datasource.url=${PEDIDOS_DB_URL:jdbc:postgresql://localhost:5432/pedidos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria/atualiza as tabelas a partir das entities (como no usuarios)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Catálogo: chamado direto pela rede interna, sem passar pelo gateway.
# Sem timeout, um catálogo travado trava o checkout junto.
catalogo.url=${CATALOGO_URL:http://localhost:3002}
catalogo.timeout=3s

# Toda linha de log mostra o X-Request-Id da requisição, que o gateway gera (ver config/RequestIdFilter).
# O %replace some com o "[] " nas linhas fora de uma requisição (subida do serviço, seed).
logging.pattern.correlation=%replace([%X{requestId}] ){'\\[\\] ', ''}

# Kafka: dentro da docker-compose, o broker é "kafka:9092" (ele não publica porta).
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.client-id=pedidos
# Grupo novo (sem offset guardado) começa do início do tópico, não só do que chegar depois
spring.kafka.consumer.auto-offset-reset=earliest
# Kafka fora: o checkout não pode ficar 60 s pendurado esperando o envio
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
