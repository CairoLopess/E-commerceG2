# Testes rodam com H2 em memória no modo PostgreSQL: não precisam de banco instalado
spring.datasource.url=jdbc:h2:mem:pedidos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Sem Kafka nos testes: não cria tópicos nem liga os listeners. O KafkaTemplate é simulado
# e os listeners são chamados direto (ver PedidosApiTests).
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
