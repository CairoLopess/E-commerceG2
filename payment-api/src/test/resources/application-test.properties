# Testes rodam com H2 em memória no modo PostgreSQL: não precisam de banco instalado
spring.datasource.url=jdbc:h2:mem:pagamentos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Sem Kafka nos testes: o KafkaTemplate é simulado e o listener é chamado direto
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false

# O banco do cartão é simulado (BancoClient). Sem esperar meio segundo entre tentativas.
banco.retry.espera=1ms
# O circuito não fecha sozinho durante um teste (cada teste o reinicia)
banco.circuito.espera-aberto=60s
