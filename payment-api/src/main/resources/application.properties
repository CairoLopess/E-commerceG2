spring.application.name=pagamentos
server.port=${PORT:3004}

# Lê o .env da raiz do repositório (ou da pasta do serviço) ao rodar fora do Docker.
# No Docker, as variáveis vêm do docker-compose.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Banco (Postgres próprio). A tabela é criada pelo schema.sql na subida (CREATE TABLE IF NOT EXISTS).
spring.datasource.url=${PAGAMENTOS_DB_URL:jdbc:postgresql://localhost:5432/pagamentos}
# Banco fora: desiste de pegar uma conexão em 2 s (o padrão é 30 s). O /health responde 503 na hora,
# e uma requisição não fica presa meio minuto esperando um banco que caiu.
spring.datasource.hikari.connection-timeout=2000
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always

# Banco do cartão (sistema externo). No compose: http://banco-falso:3000
banco.url=${BANCO_URL:http://localhost:9000}
# Timeout de cada chamada de cobrança: um pouco acima das respostas lentas normais
banco.timeout=2s
# O estorno não tem pressa (ninguém espera por ele) e não pode desistir fácil
banco.timeout-estorno=10s
# Retry: até 3 tentativas, esperando 500 ms e depois 1 s (mais um pouco de jitter)
banco.retry.espera=500ms
# Circuit breaker: abre com 50% de falha em pelo menos 5 chamadas, testa de novo depois de 15 s
banco.circuito.espera-aberto=15s

# Toda linha de log mostra o X-Request-Id da requisição, ou o correlationId do evento em tratamento
logging.pattern.correlation=%replace([%X{requestId}] ){'\\[\\] ', ''}

# Kafka: dentro da docker-compose, o broker é "kafka:9092" (ele não publica porta).
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.client-id=pagamentos
spring.kafka.consumer.auto-offset-reset=earliest
# Range: a partição N do tópico estoque e a partição N do tópico pedidos vão para a mesma réplica.
# Com a chave = id do pedido, a cobrança e o cancelamento de um pedido ficam na mesma thread.
# (Já é o padrão do cliente Kafka; fica escrito porque a corrida cobrança x cancelamento depende disso.)
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.RangeAssignor
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
