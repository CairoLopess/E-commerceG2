# Sobe o gateway, os serviços, os bancos e o Kafka: docker compose up --build
# Só o gateway publica porta para a API (8080). Dentro da rede, todo serviço HTTP escuta na 3000.
# Ferramentas, só nesta máquina: Kafka UI (8090) e a caixa de entrada do Mailpit (8025).
# Antes, copie .env.example para .env (o JWT_SECRET é obrigatório).

services:

  # ---------- usuarios: Postgres ----------
  usuarios-db:
    image: postgres:17
    environment:
      POSTGRES_DB: usuarios
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - usuarios-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d usuarios"]
      interval: 5s
      timeout: 3s
      retries: 10

  usuarios:
    build: ./usersApi
    environment:
      PORT: 3000
      # Dentro da rede do Docker, o banco é encontrado pelo nome do serviço
      DB_URL: jdbc:postgresql://usuarios-db:5432/usuarios
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (copie de .env.example)}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-2h}
    depends_on:
      usuarios-db:
        condition: service_healthy

  # ---------- catalogo: Mongo ----------
  catalogo-db:
    image: mongo:8
    volumes:
      - catalogo-db-data:/data/db
    # O mongosh é um Node: com pouca memória (WSL com 2 GB e o Kafka no ar) ele leva mais de 10 s
    # só para subir. Timeout folgado, senão o banco é dado como unhealthy e o catalogo não sobe.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  catalogo:
    build: ./catalog-api
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://catalogo-db:27017/catalogo
      KAFKA_BROKERS: kafka:9092
    depends_on:
      catalogo-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Ao parar, o consumer sai do grupo na hora e as partições passam para outra réplica
    stop_grace_period: 10s

  # ---------- pedidos: Postgres próprio ----------
  pedidos-db:
    image: postgres:17
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pedidos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10

  pedidos:
    build: ./order-api
    environment:
      PORT: 3000
      PEDIDOS_DB_URL: jdbc:postgresql://pedidos-db:5432/pedidos
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Chamada direta pela rede interna, sem passar pelo gateway
      CATALOGO_URL: http://catalogo:3000
      KAFKA_BROKERS: kafka:9092
    # Sem depends_on no catalogo de propósito: com o catálogo fora, o carrinho e a lista
    # de pedidos continuam funcionando; só o checkout responde 503.
    depends_on:
      pedidos-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    stop_grace_period: 10s

  # ---------- notificacoes: só escuta ----------
  # Sem banco, sem porta, sem rota no Kong: ninguém chama, ninguém conhece.
  notificacoes:
    build: ./notification-api
    environment:
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    stop_grace_period: 10s

  # ---------- mensageria: Kafka (KRaft) ----------
  # Um container faz tudo: broker e controller (KRaft, sem ZooKeeper). Um broker só, fator 1:
  # ótimo para aprender, inaceitável em produção. Não publica porta: só a rede interna fala com ele.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # O endereço que o Kafka informa aos clientes: o nome na rede do compose
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Id fixo do cluster KRaft (qualquer UUID em base64); o mesmo em toda subida
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Tópicos, mensagens, grupos e lag: http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:v1.1.0
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # SMTP de mentira: recebe tudo e mostra em http://localhost:8025. Nada sai para a internet.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"   # caixa de entrada (o SMTP, 1025, fica só na rede interna)

  # ---------- gateway: Kong sem banco ----------
  # A única porta da API. Os serviços não publicam porta: só o gateway os alcança.
  gateway:
    image: kong:3.9
    ports:
      - "8080:8000"                # a API da loja
      - "127.0.0.1:8001:8001"      # Admin API (só leitura no modo sem banco), só nesta máquina
      - "127.0.0.1:8002:8002"      # Kong Manager, só nesta máquina
    volumes:
      - ./kong:/kong:ro
    # Copia o kong.yml trocando __JWT_SECRET__ pelo segredo do .env e sobe o Kong.
    # $$ escapa o $ para o compose: quem expande a variável é o sh, dentro do container.
    entrypoint:
      - sh
      - -c
      - 'sed "s|__JWT_SECRET__|$${JWT_SECRET}|g" /kong/kong.yml > /tmp/kong.yml && exec /docker-entrypoint.sh kong docker-start'
    environment:
      # O mesmo segredo que o usuarios usa para assinar os tokens
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (copie de .env.example)}
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      # Libera o post-function a ler o token (kong.yml)
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: kong.plugins.jwt.jwt_parser
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

volumes:
  usuarios-db-data:
  catalogo-db-data:
  pedidos-db-data:
