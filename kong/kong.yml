# Kong sem banco (declarativo): toda a configuração do gateway está aqui.
# Mudou este arquivo? docker compose restart gateway
#
# Níveis de acesso (tag de cada route):
#   publico  nenhum plugin de acesso
#   logado   jwt         -> 401 sem token ou token inválido/vencido
#   admin    jwt + acl   -> 401 sem token, 403 se o perfil não for admin
#
# __JWT_SECRET__ é trocado pelo JWT_SECRET do .env quando o container sobe (ver docker-compose.yml).

_format_version: "3.0"

services:

  # ---------- usuarios ----------
  - name: usuarios
    url: http://usuarios:3000
    routes:
      - name: login
        methods: [POST]
        paths: ["~/auth/login$"]
        strip_path: false
        tags: [publico]
        plugins:
          # Contra força bruta: a 11ª tentativa no minuto, do mesmo IP, recebe 429
          - name: rate-limiting
            config: { minute: 10, limit_by: ip, policy: local }

      - name: cadastro
        methods: [POST]
        paths: ["~/usuarios$"]
        strip_path: false
        tags: [publico]

      - name: listar-usuarios
        methods: [GET]
        paths: ["~/usuarios$"]
        strip_path: false
        tags: [admin]
        plugins:
          - name: jwt
            config: { key_claim_name: perfil, claims_to_verify: [exp] }
          - name: acl
            config: { allow: [admin] }

      - name: meus-dados
        paths: ["~/usuarios/me(/.*)?$"]
        strip_path: false
        tags: [logado]
        plugins:
          - name: jwt
            config: { key_claim_name: perfil, claims_to_verify: [exp] }

  # ---------- catalogo ----------
  - name: catalogo
    url: http://catalogo:3000
    routes:
      # Mesmo caminho, métodos diferentes: GET é público, o resto exige admin
      - name: vitrine
        methods: [GET]
        paths: ["~/(produtos|categorias)(/.*)?$"]
        strip_path: false
        tags: [publico]

      - name: gestao-catalogo
        methods: [POST, PUT, PATCH, DELETE]
        paths: ["~/(produtos|categorias)(/.*)?$"]
        strip_path: false
        tags: [admin]
        plugins:
          - name: jwt
            config: { key_claim_name: perfil, claims_to_verify: [exp] }
          - name: acl
            config: { allow: [admin] }

  # ---------- pedidos ----------
  - name: pedidos
    url: http://pedidos:3000
    routes:
      - name: carrinho-e-pedidos
        paths: ["~/(carrinho|pedidos)(/.*)?$"]
        strip_path: false
        tags: [logado]
        plugins:
          - name: jwt
            config: { key_claim_name: perfil, claims_to_verify: [exp] }

  # ---------- health de cada serviço ----------
  # Os serviços respondem em /health; de fora, cada um tem o seu caminho.
  # strip_path: true corta /health/<servico> e o Kong chama a url do service (que já termina em /health).
  - name: usuarios-health
    url: http://usuarios:3000/health
    routes:
      - name: health-usuarios
        methods: [GET]
        paths: ["~/health/usuarios$"]
        strip_path: true
        tags: [publico]

  - name: catalogo-health
    url: http://catalogo:3000/health
    routes:
      - name: health-catalogo
        methods: [GET]
        paths: ["~/health/catalogo$"]
        strip_path: true
        tags: [publico]

  - name: pedidos-health
    url: http://pedidos:3000/health
    routes:
      - name: health-pedidos
        methods: [GET]
        paths: ["~/health/pedidos$"]
        strip_path: true
        tags: [publico]

# Um consumer por perfil, não por pessoa: o jwt acha o consumer pelo campo "perfil" do token
# (key da credencial = valor do perfil). Perfil que não está aqui -> 401.
consumers:
  - username: cliente
    jwt_secrets:
      - { key: cliente, algorithm: HS256, secret: "__JWT_SECRET__" }
    acls:
      - group: cliente

  - username: admin
    jwt_secrets:
      - { key: admin, algorithm: HS256, secret: "__JWT_SECRET__" }
    acls:
      - group: admin

# Plugins globais: valem para todas as rotas
plugins:
  # Um id por requisição, repassado aos serviços e devolvido ao cliente.
  # Se o cliente já mandar um X-Request-Id, o Kong mantém o dele.
  - name: correlation-id
    config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }

  # Antes de tudo: apaga os X-User-* que vieram de fora. Ninguém escolhe quem é.
  - name: pre-function
    config:
      access:
        - |
          kong.service.request.clear_header("X-User-Id")
          kong.service.request.clear_header("X-User-Email")
          kong.service.request.clear_header("X-User-Role")

  # Depois do jwt e do acl: copia id, e-mail e perfil do token para os cabeçalhos que os serviços leem.
  # Só existe token aqui nas rotas com o plugin jwt (logado e admin); nas públicas, nada é injetado.
  # A decisão de acesso não está aqui: quem decide é o acl.
  - name: post-function
    config:
      access:
        - |
          local token = kong.ctx.shared.authenticated_jwt_token
          if not token then
            return
          end
          local jwt_parser = require "kong.plugins.jwt.jwt_parser"
          local jwt = jwt_parser:new(token)
          if not jwt then
            return
          end
          local claims = jwt.claims
          if claims.sub then kong.service.request.set_header("X-User-Id", claims.sub) end
          if claims.email then kong.service.request.set_header("X-User-Email", claims.email) end
          if claims.perfil then kong.service.request.set_header("X-User-Role", claims.perfil) end
