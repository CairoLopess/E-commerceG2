spring.application.name=catalogo
server.port=${PORT:3002}

# Lê o .env da raiz do repositório (ou da pasta do serviço) ao rodar fora do Docker.
# No Docker, as variáveis vêm do docker-compose.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Banco (Mongo)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/catalogo}

# Cria os índices declarados nos documentos (sku e slug únicos, categoria)
spring.data.mongodb.auto-index-creation=true

# Toda linha de log mostra o X-Request-Id da requisição, que o gateway gera (ver config/RequestIdFilter).
# O %replace some com o "[] " nas linhas fora de uma requisição (subida do serviço, seed).
logging.pattern.correlation=%replace([%X{requestId}] ){'\\[\\] ', ''}
