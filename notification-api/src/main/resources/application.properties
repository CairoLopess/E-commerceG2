spring.application.name=notificacoes

# Sem web: o serviço não abre porta. Fica no ar enquanto escuta o Kafka.
spring.main.web-application-type=none

# Kafka: dentro da docker-compose, o broker é "kafka:9092" (ele não publica porta).
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.client-id=notificacoes
# Grupo novo (sem offset guardado) começa do início do tópico, não só do que chegar depois
spring.kafka.consumer.auto-offset-reset=earliest

# SMTP: o Mailpit na docker-compose (caixa de entrada em http://localhost:8025)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
notificacoes.remetente=${NOTIFICACOES_REMETENTE:loja@ecommerce.local}

# Toda linha de log escrita ao tratar um evento mostra o correlationId (o X-Request-Id do Kong).
logging.pattern.correlation=%replace([%X{requestId}] ){'\\[\\] ', ''}
