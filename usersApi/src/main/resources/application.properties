spring.application.name=usuarios
server.port=${PORT:3001}

# Lê o .env da raiz do repositório (ou da pasta do serviço) ao rodar fora do Docker.
# No Docker, as variáveis vêm do docker-compose.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Banco (Postgres)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usuarios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria/atualiza as tabelas a partir das entities.
# Atenção: o update nunca remove nem renomeia colunas (ver ADR no README).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: segredo HS256 (mínimo 32 caracteres), sem valor padrão de propósito
jwt.secret=${JWT_SECRET}
jwt.expiracao=${JWT_EXPIRACAO:2h}
